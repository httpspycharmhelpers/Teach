<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可视化教学工具</title>
    <link rel="stylesheet" href="css/style.css?v=3">
    <script src="vendor/three.min.js"></script>
    <script>
        // Three.js 加载失败时回退到 CDN（优先国内可达的镜像）
        if (typeof THREE === 'undefined') {
            document.write('<script src="https://registry.npmmirror.com/three/0.128.0/files/build/three.min.js"><\/script>');
        }
    </script>
    <script src="vendor/OrbitControls.min.js"></script>
    <script>
        if (typeof THREE === 'undefined' || typeof THREE.OrbitControls === 'undefined') {
            document.write('<script src="https://registry.npmmirror.com/three/0.128.0/files/examples/js/controls/OrbitControls.min.js"><\/script>');
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="length">长:</label>
                <div class="slider-container">
                    <input type="range" id="length" min="0.1" max="1500" value="8" step="0.1">
                    <input type="number" id="length-num" min="0.1" max="1500" value="8" step="0.1">
                </div>
                <div class="unit-selector">
                    <select id="length-unit">
                        <option value="0.000001">微米</option>
                        <option value="0.001">毫米</option>
                        <option value="1" selected>厘米</option>
                        <option value="10">分米</option>
                        <option value="100">米</option>
                    </select>
                </div>
            </div>
            <div class="control-group">
                <label for="width">宽:</label>
                <div class="slider-container">
                    <input type="range" id="width" min="0.1" max="1500" value="3" step="0.1">
                    <input type="number" id="width-num" min="0.1" max="1500" value="3" step="0.1">
                </div>
                <div class="unit-selector">
                    <select id="width-unit">
                        <option value="0.000001">微米</option>
                        <option value="0.001">毫米</option>
                        <option value="1" selected>厘米</option>
                        <option value="10">分米</option>
                        <option value="100">米</option>
                    </select>
                </div>
            </div>
            <div class="control-group">
                <label for="height">高:</label>
                <div class="slider-container">
                    <input type="range" id="height" min="0.1" max="1500" value="5" step="0.1">
                    <input type="number" id="height-num" min="0.1" max="1500" value="5" step="0.1">
                </div>
                <div class="unit-selector">
                    <select id="height-unit">
                        <option value="0.000001">微米</option>
                        <option value="0.001">毫米</option>
                        <option value="1" selected>厘米</option>
                        <option value="10">分米</option>
                        <option value="100">米</option>
                    </select>
                </div>
            </div>
            <div class="buttons">
                <button id="reset">还原</button>
                <button id="clear">清空</button>
                <button id="layer-view">分层</button>
                <button id="marker-mode">标记模式</button>
                <button id="function-mode">函数可视化</button>
                <button id="developer-mode">开发者模式</button>
                <button id="math-problems">数学题目</button>
                <button id="fullscreen">全屏</button>
            </div>
        </div>

        <div class="visualization">
            <div class="volume-display">
                体积 = <span id="volume">120</span> 立方厘米
            </div>
            <div id="cube-container">
                <!-- 标记模式工具栏 -->
                <div id="marker-controls" class="marker-controls" style="display:none;">
                    <span id="marker-count" class="marker-count">未选中</span>
                    <button class="marker-tool-btn active" data-tool="select" title="鼠标选择模式">选择</button>
                    <button class="marker-tool-btn" data-tool="move">移动</button>
                    <button class="marker-tool-btn" data-tool="resize">缩放</button>
                    <button class="marker-tool-btn" data-tool="rotate">旋转</button>
                    <input id="marker-size-input" type="number" class="marker-size-input" value="1" step="0.1" min="0.1" placeholder="尺寸">
                    <button id="marker-apply" class="marker-action-btn" title="应用尺寸">应用</button>
                    <span class="marker-angle-group">
                        <input id="marker-angle-input" type="number" class="marker-size-input" value="45" step="5" placeholder="角度">
                        <button id="marker-rotate-btn" class="marker-action-btn" title="按角度旋转选中">旋转</button>
                    </span>
                    <button id="marker-delete" class="marker-action-btn" title="删除选中">删除</button>
                    <button id="marker-note" class="marker-action-btn" title="添加备注">备注</button>
                    <button id="marker-clear" class="marker-action-btn" title="清空全部">清空</button>
                    <button id="marker-select-confirm" class="marker-action-btn" title="保存所有更改并退出标记模式">确定</button>
                    <button id="marker-notes-toggle" class="marker-action-btn" title="显示/隐藏备注浮层">显示备注</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 调试面板开关（三个点）：默认收起，点击呼出/隐藏调试面板 -->
    <button id="debug-dots" title="打开/收起调试面板" aria-label="调试面板">⋮</button>

    <!-- 函数可视化模态窗口 -->
    <div id="function-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>函数可视化工具</h3>
                <span class="close-modal">&times;</span>
            </div>
            <input type="text" class="function-input" id="function-expression" placeholder="输入函数表达式，如: sin(x)、2^n、π、√x、x^2+y" value="sin(x) * cos(z)">
            <div class="common-functions">
                <button class="function-btn" data-func="Math.sin(x)">sin(x)</button>
                <button class="function-btn" data-func="Math.cos(x)">cos(x)</button>
                <button class="function-btn" data-func="x*x">x²</button>
                <button class="function-btn" data-func="Math.sqrt(x)">√x</button>
                <button class="function-btn" data-func="Math.exp(x)">e^x</button>
                <button class="function-btn" data-func="Math.log(x)">ln(x)</button>
                <button class="function-btn" data-func="x*x + z*z">x² + z²</button>
                <button class="function-btn" data-func="Math.sin(x) * Math.cos(z)">sin(x)·cos(z)</button>
                <button class="function-btn" data-func="Math.sin(Math.sqrt(x*x+z*z))">sin(√(x²+z²))</button>
                <button class="function-btn" data-func="Math.exp(-(x*x+z*z)/10)">e^(-(x²+z²)/10)</button>
                <button class="function-btn" data-func="Math.atan2(x,z)">atan2(x,z)</button>
                <button class="function-btn" data-func="Math.hypot(x,z)">√(x²+z²)</button>
            </div>
            <div class="buttons">
                <button id="plot-2d">绘制2D图像</button>
                <button id="plot-3d">绘制3D图像</button>
                <button id="clear-function">清除函数</button>
            </div>
            <div class="hint">
                求解鸡二面：2D 沿 x 轴绘制 y=f(x,0)；点击"绘制2D"后在右下角浮动画布可拖动、缩放显示。
            </div>
        </div>
    </div>

    <!-- 2D 函数浮动画布 -->
    <div id="plot2d-panel" class="plot2d-panel" style="display:none;">
        <div class="plot2d-header">
            <span class="plot2d-title">2D 函数图像</span>
            <span class="plot2d-close">&times;</span>
        </div>
        <canvas id="plot2d-canvas" width="560" height="420"></canvas>
    </div>

    <!-- 开发者模式模态窗口 -->
    <div id="developer-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>开发者模式 - 创建几何体</h3>
                <span class="close-modal">&times;</span>
            </div>
            <div class="geometry-selector">
                <button class="geometry-btn active" data-type="box">长方体</button>
                <button class="geometry-btn" data-type="sphere">球体</button>
                <button class="geometry-btn" data-type="cylinder">圆柱体</button>
                <button class="geometry-btn" data-type="cone">圆锥体</button>
                <button class="geometry-btn" data-type="pyramid">金字塔</button>
                <button class="geometry-btn" data-type="prism">棱柱</button>
                <button class="geometry-btn" data-type="torus">圆环</button>
                <button class="geometry-btn" data-type="plane">平面</button>
            </div>
            <div class="control-group" id="sides-group" style="display:none;">
                <label for="geo-sides">边数 (棱柱/金字塔)：</label>
                <input type="range" id="geo-sides" min="3" max="32" value="6" step="1">
                <span id="geo-sides-value">6</span>
            </div>
            <div class="geo-num-row">
                <div class="control-group">
                    <label>宽(X) <input type="number" id="geo-size-x" value="5" step="0.1" min="0.1"></label>
                </div>
                <div class="control-group">
                    <label>高(Y) <input type="number" id="geo-size-y" value="5" step="0.1" min="0.1"></label>
                </div>
                <div class="control-group">
                    <label>深(Z) <input type="number" id="geo-size-z" value="5" step="0.1" min="0.1"></label>
                </div>
            </div>
            <div class="control-group">
                <label for="geo-color">颜色:</label>
                <input type="color" id="geo-color" value="#3498db">
            </div>
            <details class="geo-advanced">
                <summary>位置 / 旋转（可选，默认自动落地）</summary>
<div class="geo-num-row">
                    <div class="control-group">
                        <label>X <input type="number" id="geo-pos-x" value="0" step="1"></label>
                    </div>
                    <div class="control-group">
                        <label>Y <input type="number" id="geo-pos-y" value="0" step="1" placeholder="留空自动落地"></label>
                    </div>
                    <div class="control-group">
                        <label>Z <input type="number" id="geo-pos-z" value="0" step="1"></label>
                    </div>
                </div>
                <div class="geo-num-row">
                    <div class="control-group">
                        <label>旋转X° <input type="number" id="geo-rot-x" value="0" step="5"></label>
                    </div>
                    <div class="control-group">
                        <label>旋转Y° <input type="number" id="geo-rot-y" value="0" step="5"></label>
                    </div>
                    <div class="control-group">
                        <label>旋转Z° <input type="number" id="geo-rot-z" value="0" step="5"></label>
                    </div>
                </div>
            </details>
            <div class="buttons">
                <button id="add-geometry">添加到场景</button>
                <button id="clear-geometry">清空几何体</button>
            </div>
            <hr class="geo-divider">
            <div id="define-model-section">
                <p class="scan-hint"><b>添加/定义模型</b>：上传三视图图片（正面/上面/左面），自动分析并生成立体，可选中后移动坐标、改大小、上色、添加备注。</p>
                <div class="define-row">
                    <input type="file" id="define-model-input" accept="image/*">
                    <button id="define-model-btn">分析并定义</button>
                </div>
                <img id="define-preview" class="note-preview" style="display:none;">
                <div id="define-result" class="scan-result"></div>
            </div>
        </div>
    </div>

    <!-- 数学题目模态窗口 -->
    <div id="math-problems-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>数学题目练习</h3>
                <span class="close-modal">&times;</span>
            </div>
            <div class="problem-tabs">
                <button class="problem-tab active" data-level="base">基础</button>
                <button class="problem-tab" data-level="mid">进阶</button>
                <button class="problem-tab" data-level="hard">挑战</button>
            </div>
            <div id="problem-answer" class="problem-answer" style="display:none;"></div>
            <div class="math-problem-list" id="math-problem-list">
            </div>
        </div>
    </div>

    <!-- 注释画布模态窗口 -->
    <div id="annotation-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加注释</h3>
                <span class="close-modal">&times;</span>
            </div>
            <div class="toolbar">
                <button class="tool-btn active" data-tool="pen">画笔</button>
                <button class="tool-btn" data-tool="eraser">橡皮擦</button>
                <button class="tool-btn" data-tool="text">文字</button>
            </div>
            <canvas id="annotation-canvas" class="annotation-canvas" width="400" height="300"></canvas>
            <div class="buttons" style="margin-top: 15px;">
                <button id="save-annotation">保存注释</button>
                <button id="clear-annotation">清除画布</button>
            </div>
        </div>
    </div>

    <!-- 备注模态窗口 -->
    <!-- 模型编辑面板：选中自定义几何体后可移动/改大小/上色/备注 -->
    <div id="model-editor" style="display:none;">
        <div class="me-title"><span id="me-name">模型</span><button id="me-close">&times;</button></div>
        <div class="me-row">
            <label>X <input type="number" id="me-pos-x" step="0.5"></label>
            <label>Y <input type="number" id="me-pos-y" step="0.5"></label>
            <label>Z <input type="number" id="me-pos-z" step="0.5"></label>
        </div>
        <div class="me-row">
            <label>宽 <input type="number" id="me-size-w" step="0.5" min="0.1"></label>
            <label>高 <input type="number" id="me-size-h" step="0.5" min="0.1"></label>
            <label>深 <input type="number" id="me-size-d" step="0.5" min="0.1"></label>
        </div>
        <div class="me-row">
            <label>颜色 <input type="color" id="me-color" value="#3498db"></label>
        </div>
        <div class="me-row">
            <button id="me-note">备注</button>
            <button id="me-delete">删除</button>
            <span id="me-tip">拖动模型可移动</span>
        </div>
    </div>

    <div id="note-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加备注</h3>
                <span class="close-modal" onclick="document.getElementById('note-modal').style.display='none'">&times;</span>
            </div>
            <div class="note-editor">
                <label>文字备注：</label>
                <textarea id="note-text" rows="4" placeholder="输入文字备注..."></textarea>
                <label>添加图片：</label>
                <input type="file" id="note-image-input" accept="image/*">
                <img id="note-image-preview" class="note-preview" style="display:none;">
                <div class="buttons" style="margin-top: 15px;">
                    <button id="note-save">保存</button>
                    <button id="note-cancel">取消</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/cubic.js?v=3"></script>
    <script src="js/functions.js?v=3"></script>
    <script src="js/developer.js?v=3"></script>
    <script src="js/math.js?v=3"></script>
    <script src="js/annotation.js?v=3"></script>
    <script src="js/recognize.js?v=3"></script>
    <script src="js/app.js?v=3"></script>
</body>
</html>
